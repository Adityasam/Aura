name: Django Deployment

on:
  push:
    branches: [ main ]  # Triggers when you push to the main branch
  workflow_dispatch: # This adds the manual "Run" button
    inputs:
      reason:
        description: 'Reason for manual deploy'
        required: false
        default: 'Manual update'

jobs:
  deploy:
    runs-on: self-hosted  # This tells it to run on your Windows VPS

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Sync Files and Update
        shell: powershell
        run: |
          cd "C:\AudioPlayer"
          
          # 2. Pull the latest code
          git pull origin main

          # 1. Load the required IIS module
          Import-Module WebAdministration
          
          # 2. Check if the IIS drive exists; if not, navigate via the provider
          if (Test-Path "IIS:\AppPools\MusicPlayer") {
              Write-Host "Confirmed: MusicPlayer exists. Restarting..."
              Restart-WebAppPool -Name "MusicPlayer"
          } else {
              Write-Error "CRITICAL: MusicPlayer not found in IIS:\AppPools"
              Write-Host "Available Pools are:"
              Get-ChildItem "IIS:\AppPools" | Select-Object Name, State
              exit 1
          }
          
          # Restart-WebAppPool -Name "MusicPlayer"