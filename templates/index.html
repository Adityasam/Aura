<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aura Premium Player</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
    <link rel="icon" href="{{ url_for('static', filename='icons/icon-192.png') }}">
    <script src="/static/js/myToastr.js"></script>

    <style>
        :root {
            --orange: #ff4d4d;
            --blue: #4d8cff;
            --dark-bg: #050505;
            --surface: rgba(255, 255, 255, 0.05);
            --surface-hover: rgba(255, 255, 255, 0.1);
            --text-primary: #ffffff;
            --text-secondary: #b0b0b0;
            --accent-gradient: linear-gradient(135deg, var(--orange) 0%, #ff8c42 100%);
            --glass: rgba(255, 255, 255, 0.07);
            --glass-border: rgba(255, 255, 255, 0.1);
            --shadow-lg: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --radius-xl: 32px;
            --radius-lg: 24px;
            --radius-md: 16px;
        }

        * {
            box-sizing: border-box;
            transition: var(--transition);
        }

        html,
        body {
            overscroll-behavior-y: contain;
            background-color: transparent;
            color: var(--text-primary);
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            font-size: 14px;
            margin: 0;
            overflow-x: hidden;
            background: transparent;
            min-height: 100vh;
            letter-spacing: -0.015em;
        }

        /* Background Blobs */
        .bg-blobs {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -10;
            overflow: hidden;
            background: var(--dark-bg);
        }

        .blob {
            position: absolute;
            width: 600px;
            height: 600px;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.4;
            animation: blob-float 25s infinite alternate;
        }

        .blob-orange {
            background: radial-gradient(circle, var(--orange) 0%, transparent 70%);
            top: -100px;
            left: -100px;
        }

        .blob-blue {
            background: radial-gradient(circle, var(--blue) 0%, transparent 70%);
            bottom: -100px;
            right: -100px;
            animation-delay: -5s;
        }

        .blob-orange-2 {
            background: radial-gradient(circle, var(--orange) 0%, transparent 70%);
            bottom: 10%;
            left: 20%;
            width: 300px;
            height: 300px;
            animation-delay: -10s;
        }

        .blob-blue-2 {
            background: radial-gradient(circle, var(--blue) 0%, transparent 70%);
            top: 20%;
            right: 15%;
            width: 400px;
            height: 400px;
            animation-delay: -15s;
        }

        @keyframes blob-float {
            0% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(30px, -50px) scale(1.1); }
            66% { transform: translate(-20px, 20px) scale(0.9); }
            100% { transform: translate(0, 0) scale(1); }
        }

        .app-header {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 1.2rem 1.5rem;
            max-width: 850px;
            margin: 0 auto;
            position: sticky;
            top: 0;
            z-index: 1000;
            background: transparent;
            backdrop-filter: blur(30px) saturate(180%);
            -webkit-backdrop-filter: blur(30px) saturate(180%);
            border-bottom-left-radius: var(--radius-lg);
            border-bottom-right-radius: var(--radius-lg);
        }

        .header-burger {
            width: 44px;
            height: 44px;
            background: var(--glass);
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-primary);
            cursor: pointer;
            border: 1px solid var(--glass-border);
            flex-shrink: 0;
        }

        .header-burger:hover {
            background: var(--surface-hover);
            transform: scale(1.05);
        }

        .header-search {
            flex-grow: 1;
        }

        .header-search .d-flex {
            background: var(--glass);
            border-radius: var(--radius-md);
            padding: 4px 8px;
            border: 1px solid var(--glass-border);
        }

        .header-search .d-flex:focus-within {
            border-color: rgba(255, 77, 77, 0.5);
            background: rgba(255, 255, 255, 0.1);
        }

        input {
            background: transparent !important;
            border: none !important;
            box-shadow: none !important;
            color: var(--text-primary) !important;
            height: 38px !important;
            font-size: 0.95rem !important;
            padding: 0 1rem !important;
        }

        input::placeholder {
            color: var(--text-secondary) !important;
            opacity: 0.5;
        }

        .search-btn {
            background: transparent !important;
            width: 38px !important;
            height: 38px !important;
            border-radius: var(--radius-md) !important;
            color: var(--text-secondary) !important;
            border: none !important;
            display: flex !important;
            align-items: center;
            justify-content: center;
        }

        .search-btn:hover {
            color: var(--orange) !important;
            background: rgba(255, 77, 77, 0.1) !important;
        }

        .nav-bar {
            display: flex;
            justify-content: center;
            gap: 0.8rem;
            padding: 1rem 1.5rem;
            max-width: 850px;
            margin: 0 auto;
        }

        .play-mode {
            background: var(--glass);
            padding: 0.7rem 1.2rem;
            border-radius: var(--radius-md);
            font-weight: 600;
            color: var(--text-secondary);
            cursor: pointer;
            border: 1px solid var(--glass-border);
            flex: 1;
            text-align: center;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(10px);
        }

        .play-mode.active {
            background: var(--orange);
            color: white;
            border-color: transparent;
            box-shadow: 0 8px 20px rgba(255, 77, 77, 0.3);
        }

        .main-song-container {
            margin: 0 auto 2rem;
            max-width: 420px;
            padding: 0;
            background: var(--glass);
            border-radius: var(--radius-xl);
            border: 1px solid var(--glass-border);
            box-shadow: var(--shadow-lg);
            position: relative;
            overflow: hidden;
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
        }

        .player-thumbnail-container {
            width: 80%;
            margin: 1.5rem auto 0;
            aspect-ratio: 1/1;
            position: relative;
            overflow: hidden;
            border-radius: var(--radius-lg);
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
        }

        .main-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .main-song-info-block {
            padding: 1.5rem;
            text-align: center;
            background: linear-gradient(to bottom, transparent, rgba(0,0,0,0.4));
        }

        .main-song-name {
            font-size: 1.2rem;
            font-weight: 800;
            color: var(--text-primary);
            margin-bottom: 1.2rem;
            letter-spacing: -0.03em;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .control-btn {
            font-size: 1.1rem;
            color: var(--text-secondary);
            cursor: pointer;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
        }

        .control-btn:hover {
            color: var(--text-primary);
            background: rgba(255, 255, 255, 0.1);
            transform: scale(1.1);
        }

        .play-btn-main {
            width: 60px;
            height: 60px;
            background: var(--orange);
            border-radius: 50%;
            padding: 15px;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(255, 77, 77, 0.4);
        }

        .play-btn-main:hover {
            transform: scale(1.1);
            box-shadow: 0 12px 30px rgba(255, 77, 77, 0.5);
        }

        .song-slider-container {
            padding: 1.2rem 0 0.4rem;
        }

        .slider-track {
            height: 5px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            position: relative;
            cursor: pointer;
        }

        .slider-fill {
            background: var(--accent-gradient);
            border-radius: 10px;
            height: 100%;
            width: 0%;
        }

        .slider {
            width: 12px;
            height: 12px;
            background: white;
            border-radius: 50%;
            position: absolute;
            top: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 15px rgba(255, 77, 77, 0.6);
            pointer-events: none;
        }

        .time-stamp-container {
            display: flex;
            justify-content: space-between;
            color: var(--text-secondary);
            font-size: 0.75rem;
            font-weight: 600;
            margin-top: 4px;
        }

        .playback-options {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin-top: 1rem;
        }

        .loop-type {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 0.8rem;
            background: transparent;
        }

        .loop-type:hover {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-primary);
        }

        .loop-type.active {
            color: var(--orange);
            background: rgba(255, 77, 77, 0.08);
        }

        .playback-options-group {
            z-index: 5;
            padding-left: 0.5rem;
        }

        .online-list-container, .offline-list-container {
            width: 100%;
            max-width: 850px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding: 0 1.5rem 8rem;
        }

        .list-item-box {
            background: var(--glass);
            border-radius: var(--radius-lg);
            padding: 8px 16px;
            display: flex;
            align-items: center;
            gap: 14px;
            cursor: pointer;
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(10px);
        }

        .list-item-box:hover {
            background: var(--surface-hover);
            transform: translateX(5px);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .list-item-box.selected {
            background: rgba(255, 77, 77, 0.1);
            border-color: rgba(255, 77, 77, 0.3);
        }

        .list-item-box img {
            width: 48px;
            height: 48px;
            border-radius: var(--radius-md);
            object-fit: cover;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .song-info {
            flex: 1;
            min-width: 0;
        }

        .song-name {
            font-weight: 700;
            color: var(--text-primary);
            font-size: 0.95rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 2px;
        }

        .atrist-name {
            color: var(--text-secondary);
            font-size: 0.8rem;
            font-weight: 500;
        }

        .delbtn {
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: var(--radius-md);
            color: var(--text-secondary);
            opacity: 0.6;
            font-size: 0.9rem;
        }

        .delbtn:hover {
            background: rgba(255, 77, 77, 0.2);
            color: var(--orange);
            opacity: 1;
        }

        .side-menu {
            background: rgba(5, 5, 5, 0.8);
            backdrop-filter: blur(40px);
            border-right: 1px solid var(--glass-border);
            width: 280px;
            padding: 2rem 1.5rem;
            position: fixed;
            top: 0;
            left: 0;
            height: 100vh;
            z-index: 2000;
            transform: translateX(-100%);
            box-shadow: 25px 0 50px rgba(0,0,0,0.6);
        }

        .side-menu.active {
            transform: translateX(0);
        }

        .menu-header {
            font-size: 1.4rem;
            margin-bottom: 2.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-weight: 800;
            letter-spacing: -0.04em;
        }

        .menu-item {
            padding: 0.8rem 1rem;
            margin-bottom: 0.5rem;
            border-radius: var(--radius-md);
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            gap: 14px;
            cursor: pointer;
            color: var(--text-secondary);
            font-weight: 600;
        }

        .menu-item:hover {
            background: var(--glass);
            color: var(--text-primary);
            transform: translateX(5px);
        }

        .menu-item i {
            color: var(--orange);
            font-size: 1.1rem;
            width: 24px;
            text-align: center;
        }

        .mini-player {
            background: rgba(10, 10, 10, 0.7);
            backdrop-filter: blur(30px) saturate(180%);
            -webkit-backdrop-filter: blur(30px) saturate(180%);
            border-top: 1px solid var(--glass-border);
            padding: 0.6rem 1.5rem;
            height: 70px;
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            z-index: 1100;
            transform: translateY(100%);
            display: flex;
            flex-direction: column;
            box-shadow: 0 -15px 35px rgba(0,0,0,0.5);
        }

        .mini-player.active {
            transform: translateY(0);
        }

        .mini-progress-container {
            height: 3px;
            background: rgba(255,255,255,0.05);
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
        }

        .mini-progress-bar {
            height: 100%;
            background: var(--orange);
            width: 0%;
        }

        .mini-player-img {
            width: 44px;
            height: 44px;
            border-radius: var(--radius-md);
            object-fit: cover;
            border: 1px solid var(--glass-border);
        }

        .mini-player-name {
            font-size: 0.9rem;
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: -0.02em;
        }

        .offline-search-container {
            background: var(--glass);
            border-radius: var(--radius-lg);
            padding: 0 1.2rem;
            margin: 0 1.5rem 1rem;
            border: 1px solid var(--glass-border);
            height: 40px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .offline-search-container:focus-within {
            border-color: rgba(255, 77, 77, 0.4);
            background: rgba(255, 255, 255, 0.1);
        }

        .offline-search-container i {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        .side-menu-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(10px);
            z-index: 1500;
            opacity: 0;
            pointer-events: none;
        }

        .side-menu-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .result-type-container {
            display: flex;
            gap: 0.8rem;
            padding: 0 1.5rem 1rem;
            max-width: 850px;
            margin: 0 auto;
        }

        .result-type {
            background: var(--glass);
            border-radius: var(--radius-md);
            padding: 0.6rem;
            flex: 1;
            text-align: center;
            cursor: pointer;
            color: var(--text-secondary);
            font-size: 0.85rem;
            border: 1px solid var(--glass-border);
            font-weight: 700;
            letter-spacing: 0.02em;
        }

        .result-type.active {
            background: rgba(255, 77, 77, 0.1);
            color: var(--orange);
            border-color: rgba(255, 77, 77, 0.3);
        }

        .close-menu {
            width: 36px;
            height: 36px;
            border-radius: var(--radius-md);
            background: var(--glass);
            border: none;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Toast Notification */
        .my-toast-container {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: rgba(20, 20, 25, 0.9);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            color: var(--text-primary);
            padding: 12px 24px;
            border-radius: var(--radius-md);
            font-weight: 600;
            z-index: 3000;
            opacity: 0;
            pointer-events: none;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            white-space: nowrap;
        }

        .my-toast-container.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
            pointer-events: auto;
        }

        .my-toast-container.success {
            border-bottom: 4px solid #4caf50;
        }

        .my-toast-container.warning {
            border-bottom: 4px solid #ff9800;
        }

        .my-toast-container.error {
            border-bottom: 4px solid var(--orange);
        }

        /* Mobile adjustments */
        @media (max-width: 768px) {
            .app-header { padding: 1rem; }
            .nav-bar { padding: 0.8rem 1rem; }
            .main-song-container { margin: 1rem; max-width: none; border-radius: var(--radius-xl); }
            .online-list-container, .offline-list-container { padding: 0 1rem 8rem; }
            .list-item-box { padding: 10px 14px; border-radius: var(--radius-lg); }
            .mini-player { height: 65px; padding: 0.5rem 1rem; }
        }
    </style>
</head>

<body>
    <!-- Background Blobs -->
    <div class="bg-blobs">
        <div class="blob blob-orange"></div>
        <div class="blob blob-blue"></div>
        <div class="blob blob-orange-2"></div>
        <div class="blob blob-blue-2"></div>
    </div>

    <!-- Side Menu -->
    <div class="side-menu-overlay" id="side-menu-overlay" onclick="toggleSideMenu()"></div>
    <div class="side-menu" id="side-menu">
        <div class="menu-header">
            <span><i class="fas fa-music"></i> Aura</span>
            <button class="close-menu" onclick="toggleSideMenu()">
                <i class="fas fa-times"></i>
            </button>
        </div>
        <div class="menu-item" onclick="export_songs()">
            <i class="fas fa-file-export"></i>
            <span>Export Library</span>
        </div>
        <div class="menu-item" onclick="import_songs()">
            <i class="fas fa-file-import"></i>
            <span>Import Backup</span>
        </div>
        <div class="mt-auto p-2" style="font-size: 0.75rem; color: var(--text-secondary); text-align: center; opacity: 0.4;">
            Aura Premium v2.1
        </div>
        <input type="file" id="import-file" hidden accept=".json" onchange="process_import(event)">
    </div>

    <!-- App Header -->
    <header class="app-header">
        <div class="header-burger" onclick="toggleSideMenu()">
            <i class="fas fa-bars"></i>
        </div>
        <div class="header-search">
            <div class="d-flex align-items-center">
                <input type="text" class="form-control" id="search"
                    placeholder="Search music..." autocomplete="off"
                    onkeypress="if(event.key==='Enter') search_song()">
                <button class="search-btn" onclick="search_song()">
                    <i class="fas fa-search"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- Navigation Bar -->
    <nav class="nav-bar">
        <div id="play-offline" class="play-mode active" onclick="change_mode('offline')">
            Library
        </div>
        <div id="play-online" class="play-mode" onclick="change_mode('online')">
            Discovery
        </div>
    </nav>

    <div class="container-fluid p-0">
        <div class="main-song-container">
            <div class="main-image-container">
                <audio src="" hidden id="audio_player"></audio>
                <div class="player-thumbnail-container">
                    <img id="song-image" src="/static/img/bg.png" class="main-image" alt="">
                </div>
                <div class="main-song-info-block">
                    <div class="main-song-name" id="song-name">Select a Song</div>
                    
                    <div class="d-flex align-items-center justify-content-center position-relative mb-2">
                        <div class="playback-options-group d-flex gap-1 position-absolute start-0">
                            <div id="song-loop" class="loop-type active" onclick="change_play_type('loop')" title="Loop All">
                                <i class="fas fa-redo"></i>
                            </div>
                            <div hidden id="song-single-loop" class="loop-type" onclick="change_play_type('single-loop')" title="Loop One">
                                <i class="fas fa-redo-alt"></i>
                            </div>
                            <div hidden id="song-shuffle" class="loop-type" onclick="change_play_type('shuffle')" title="Shuffle">
                                <i class="fas fa-random"></i>
                            </div>
                        </div>

                        <div class="d-flex align-items-center gap-4">
                            <i class="fas fa-backward control-btn" onclick="prev_song()"></i>
                            <div class="position-relative">
                                <img src="/static/icons/play.webp" alt="" onclick="player.play()" id="play-btn" class="play-btn-main">
                                <img src="/static/icons/pause.png" onclick="player.pause()" alt="" hidden id="pause-btn" class="play-btn-main">
                                <div id="song-loader" hidden class="position-absolute top-50 start-50 translate-middle">
                                    <img src="/static/img/loader.gif" width="30" alt="">
                                </div>
                            </div>
                            <i class="fas fa-forward control-btn" onclick="next_song()"></i>
                        </div>
                    </div>
                    
                    <div class="song-slider-container">
                        <div class="slider-track" id="time-track">
                            <div class="slider-fill" id="time-fill"></div>
                            <div class="slider" id="time-slider"></div>
                        </div>
                    </div>
                    <div class="time-stamp-container">
                        <div id="elapsed-time">00:00</div>
                        <div id="total-time">00:00</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="mode-block" hidden id="online-block">
            <div class="result-type-container">
                <div class="result-type active" id="type-song" onclick="toggle_type('song')">
                    Audio
                </div>
                <div class="result-type" id="type-video" onclick="toggle_type('video')">
                    Video
                </div>
            </div>

            <div id="song-loading" hidden class="text-center p-3">
                <img src="/static/img/page_loader.gif" alt="" style="width: 32px;">
            </div>
            <div class="online-list-container mx-auto" id="song-list"></div>
            <div id="no-result" hidden>No results found</div>
        </div>

        <div class="mode-block" id="offline-block">
            <div class="offline-search-container">
                <i class="fas fa-search"></i>
                <input type="text" placeholder="Search library..." onkeyup="create_song_card()"
                    class="form-control" id="offline-search">
            </div>
            <div class="offline-list-container mx-auto" id="offline-song-list"></div>
            <div id="no-result-offline" hidden>Library is empty</div>
        </div>
    </div>

    <div class="my-toast-container" id="my-toastr"></div>

    <!-- Mini Player -->
    <div class="mini-player" id="mini-player">
        <div class="mini-progress-container">
            <div class="mini-progress-bar" id="mini-progress-bar"></div>
        </div>
        <div class="d-flex align-items-center justify-content-between h-100">
            <div class="mini-player-info d-flex align-items-center gap-2" onclick="scrollToTop()" style="cursor: pointer; flex: 1; min-width: 0;">
                <img src="/static/img/bg.png" class="mini-player-img" id="mini-player-img">
                <div style="min-width: 0;">
                    <div class="mini-player-name" id="mini-player-name" style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">Unknown Song</div>
                </div>
            </div>
            <div class="d-flex gap-2">
                <i class="fas fa-play" id="mini-play-btn" onclick="player.play()" style="cursor: pointer; color: var(--orange); font-size: 1.1rem;"></i>
                <i class="fas fa-pause" id="mini-pause-btn" hidden onclick="player.pause()" style="cursor: pointer; color: var(--orange); font-size: 1.1rem;"></i>
            </div>
        </div>
    </div>

    <!-- Templates -->
    <div hidden id="song-template" class="list-item-box">
        <img src="/static/img/bg.png" class="click-btn" alt="">
        <div class="song-info click-btn">
            <div class="song-name">Song Name</div>
            <div class="atrist-name">Artist Name</div>
        </div>
        <i class="fas fa-trash-alt delbtn" onclick="delete_song(event)"></i>
    </div>
</body>
<script>
    const parent = document.getElementById("song-list");
    const offline_parent = document.getElementById("offline-song-list");
    const song_temp = document.getElementById("song-template");
    const player = document.getElementById("audio_player");
    const song_image = document.getElementById("song-image");
    const song_name = document.getElementById("song-name");
    const play_btn = document.getElementById("play-btn");
    const pause_btn = document.getElementById("pause-btn");
    const song_loader = document.getElementById("song-loader");
    const time_slider = document.getElementById("time-slider");
    const time_fill = document.getElementById("time-fill");
    const elapsed_time = document.getElementById("elapsed-time");
    const total_time = document.getElementById("total-time");
    const track = document.getElementById("time-track");
    const miniPlayBtn = document.getElementById("mini-play-btn");
    const miniPauseBtn = document.getElementById("mini-pause-btn");
    const miniProgressBar = document.getElementById("mini-progress-bar");
    const miniPlayerImg = document.getElementById("mini-player-img");
    const miniPlayerName = document.getElementById("mini-player-name");
    const noresult = document.getElementById("no-result");
    const noresult_offline = document.getElementById("no-result-offline");
    const songloader = document.getElementById("song-loading");

    const miniPlayer = document.getElementById("mini-player");

    let savedSongs = [];
    let searchResults = [];
    let currentMode = "offline";
    let currentType = "song";
    let currentSongId = "";
    let currentPlayType = "loop";

    const dbName = "myMediaDB";
    const dbVersion = 2;
    let db;

    async function initDB() {
        return new Promise((resolve, reject) => {
            const request = indexedDB.open(dbName, dbVersion);
            request.onupgradeneeded = (e) => {
                const db = e.target.result;
                if (!db.objectStoreNames.contains('songs')) {
                    db.createObjectStore('songs');
                }
            };
            request.onsuccess = (e) => {
                db = e.target.result;
                resolve(db);
            };
            request.onerror = (e) => reject(e);
        });
    }

    async function saveBlob(song) {
        if (!db) return;
        
        if (!song.index) song.index = Date.now();
        
        if (song.image && song.image.includes("w60-h60")) {
            song.image = song.image.replace("w60-h60", "w400-h400");
            delete song.image_blob;
        }
        
        if (!song.image_blob && song.image) {
            try {
                const response = await fetch(song.image);
                const blob = await response.blob();
                song.image_blob = blob;
            } catch (e) {
                console.error("Failed to save image blob:", e);
            }
        }

        const tx = db.transaction('songs', 'readwrite');
        const store = tx.objectStore('songs');
        store.put(song, song.id);
        tx.oncomplete = () => create_saved_song_list();
    }

    async function loadBlob(id) {
        if (!db) return null;
        return new Promise((resolve) => {
            const tx = db.transaction('songs', 'readonly');
            const store = tx.objectStore('songs');
            const request = store.get(id);
            request.onsuccess = () => resolve(request.result);
            request.onerror = () => resolve(null);
        });
    }

    function delete_song(e) {
        e.stopPropagation();
        const id = e.target.closest('.delbtn').getAttribute("data-id");
        if (!confirm("Remove this song from library?")) return;
        
        const tx = db.transaction('songs', 'readwrite');
        const store = tx.objectStore('songs');
        store.delete(id);
        tx.oncomplete = () => {
            show_toast("Song removed");
            create_saved_song_list();
        };
    }

    function export_songs() {
        if (!db) return;
        const tx = db.transaction('songs', 'readonly');
        const store = tx.objectStore('songs');
        const request = store.getAll();
        request.onsuccess = () => {
            const songs = request.result;
            if (!songs || songs.length === 0) {
                show_toast("No songs to export");
                return;
            }
            const exportData = songs.map(s => {
                const { blob, image_blob, ...rest } = s;
                return rest;
            });
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(exportData));
            const downloadAnchorNode = document.createElement('a');
            downloadAnchorNode.setAttribute("href", dataStr);
            downloadAnchorNode.setAttribute("download", "aura_export.json");
            document.body.appendChild(downloadAnchorNode); 
            downloadAnchorNode.click();
            downloadAnchorNode.remove();
            show_toast(`Exported ${exportData.length} songs`);
        };
    }

    function import_songs() {
        document.getElementById('import-file').click();
    }

    function process_import(event) {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const songs = JSON.parse(e.target.result);
                if (!Array.isArray(songs)) {
                    show_toast("Invalid file format");
                    return;
                }

                const tx = db.transaction('songs', 'readwrite');
                const store = tx.objectStore('songs');
                let addedCount = 0;
                let processedCount = 0;

                songs.forEach(song => {
                    if (song.id) {
                        const request = store.get(song.id);
                        request.onsuccess = (ev) => {
                            if (!ev.target.result) {
                                store.put(song, song.id);
                                addedCount++;
                            }
                            processedCount++;
                            checkCompletion();
                        };
                        request.onerror = () => {
                             processedCount++;
                             checkCompletion();
                        };
                    } else {
                        processedCount++;
                        checkCompletion();
                    }
                });

                function checkCompletion() {
                    if (processedCount === songs.length) {
                        if (addedCount > 0) {
                            show_toast(`Imported ${addedCount} new songs`);
                            create_saved_song_list();
                        } else {
                            show_toast("No new songs to import");
                        }
                        event.target.value = '';
                    }
                }
            } catch (err) {
                show_toast("Error parsing file");
            }
        };
        reader.readAsText(file);
    }

    function formatTime(seconds) {
        const min = Math.floor(seconds / 60);
        const sec = Math.floor(seconds % 60);
        return (min < 10 ? '0' : '') + min + ":" + (sec < 10 ? '0' : '') + sec;
    }

    function set_play_state(state) {
        current_state = state;
        if (state == "play") { // Music is PAUSED
            pause_btn.hidden = true;
            song_loader.hidden = true;
            play_btn.hidden = false;
            miniPlayBtn.hidden = false;
            miniPauseBtn.hidden = true;
        } else if (state == "pause") { // Music is PLAYING
            pause_btn.hidden = false;
            song_loader.hidden = true;
            play_btn.hidden = true;
            miniPlayBtn.hidden = true;
            miniPauseBtn.hidden = false;
        } else if (state == "loading") {
            pause_btn.hidden = true;
            song_loader.hidden = false;
            play_btn.hidden = true;
            miniPlayBtn.hidden = true;
            miniPauseBtn.hidden = true;
        }
    }

    function next_song() {
        const list = currentMode === "offline" ? savedSongs : searchResults.filter(s => s.resultType === currentType);
        if (list.length === 0) return;
        
        let index = list.findIndex(s => s.id === currentSongId);
        if (currentPlayType === "shuffle") {
            index = Math.floor(Math.random() * list.length);
        } else {
            index = (index + 1) % list.length;
        }
        load_song(list[index]);
    }

    function prev_song() {
        const list = currentMode === "offline" ? savedSongs : searchResults.filter(s => s.resultType === currentType);
        if (list.length === 0) return;
        
        let index = list.findIndex(s => s.id === currentSongId);
        index = (index - 1 + list.length) % list.length;
        load_song(list[index]);
    }

    function change_play_type(type) {
        document.getElementById("song-loop").hidden = true;
        document.getElementById("song-single-loop").hidden = true;
        document.getElementById("song-shuffle").hidden = true;
        
        if (type === "loop") {
            currentPlayType = "single-loop";
            document.getElementById("song-single-loop").hidden = false;
        } else if (type === "single-loop") {
            currentPlayType = "shuffle";
            document.getElementById("song-shuffle").hidden = false;
        } else {
            currentPlayType = "loop";
            document.getElementById("song-loop").hidden = false;
        }
        show_toast(`Play mode: ${currentPlayType}`);
    }

    player.onended = () => {
        if (currentPlayType === "single-loop") {
            player.currentTime = 0;
            player.play();
        } else {
            next_song();
        }
    };

    function updateMediaSession(song) {
        if ('mediaSession' in navigator) {
            navigator.mediaSession.metadata = new MediaMetadata({
                title: song.song_name || "Unknown Song",
                artist: song.artist_name || "Unknown Artist",
                album: 'Aura Music',
                artwork: [
                    { src: song.image, sizes: '96x96', type: 'image/jpeg' },
                    { src: song.image, sizes: '128x128', type: 'image/jpeg' },
                    { src: song.image, sizes: '192x192', type: 'image/jpeg' },
                    { src: song.image, sizes: '256x256', type: 'image/jpeg' },
                    { src: song.image, sizes: '384x384', type: 'image/jpeg' },
                    { src: song.image, sizes: '512x512', type: 'image/jpeg' },
                ]
            });

            navigator.mediaSession.setActionHandler('play', () => player.play());
            navigator.mediaSession.setActionHandler('pause', () => player.pause());
            navigator.mediaSession.setActionHandler('previoustrack', () => prev_song());
            navigator.mediaSession.setActionHandler('nexttrack', () => next_song());
            navigator.mediaSession.setActionHandler('seekbackward', (details) => {
                const skipTime = details.seekOffset || 10;
                player.currentTime = Math.max(player.currentTime - skipTime, 0);
            });
            navigator.mediaSession.setActionHandler('seekforward', (details) => {
                const skipTime = details.seekOffset || 10;
                player.currentTime = Math.min(player.currentTime + skipTime, player.duration);
            });
            navigator.mediaSession.setActionHandler('seekto', (details) => {
                if (details.fastSeek && 'fastSeek' in player) {
                    player.fastSeek(details.seekTime);
                    return;
                }
                player.currentTime = details.seekTime;
            });
        }
    }

    async function load_song(song, autoPlay = true) {
        try {
            const id = song.id;
            currentSongId = song.id;
            localStorage.setItem("lastPlayedSong", JSON.stringify(song));

            document.querySelectorAll(".list-item-box").forEach(box => {
                if (box.getAttribute("data-song-id") === id) box.classList.add("selected");
                else box.classList.remove("selected");
            });

            player.currentTime = 0;
            const savedData = await loadBlob(id);
            
            let imageUrl = song.image;
            let needsImageUpdate = false;

            if (imageUrl && imageUrl.includes("w60-h60")) {
                imageUrl = imageUrl.replace("w60-h60", "w400-h400");
                song.image = imageUrl;
                needsImageUpdate = true;
            }

            if (savedData && savedData.image_blob instanceof Blob && !needsImageUpdate) {
                imageUrl = URL.createObjectURL(savedData.image_blob);
            }

            song_image.crossOrigin = "anonymous";
            miniPlayerImg.crossOrigin = "anonymous";
            song_image.src = imageUrl || "/static/img/bg.png";
            miniPlayerImg.src = imageUrl || "/static/img/bg.png";

            song_name.innerHTML = song.song_name || "Unknown Song";
            miniPlayerName.innerHTML = song.song_name || "Unknown Song";
            
            updateMediaSession(song);
            set_play_state(autoPlay ? "loading" : "play");

            if (savedData && savedData.blob instanceof Blob) {
                player.src = URL.createObjectURL(savedData.blob);
                if (autoPlay) player.play().catch(() => set_play_state("play"));
                if (needsImageUpdate) saveBlob(song);
            } else {
                const fetchType = song.resultType || "song";
                fetch(`/load_song?id=${id}&type=${fetchType}`)
                    .then(res => res.blob())
                    .then(blob => {
                        if (blob instanceof Blob) {
                            player.src = URL.createObjectURL(blob);
                            if (autoPlay) player.play().catch(() => set_play_state("play"));
                            song["blob"] = blob;
                            saveBlob(song);
                        }
                    })
                    .catch(() => set_play_state("play"));
            }
        } catch (err) {
            console.error(err);
        }
    }

    function search_song() {
        const searchInput = document.getElementById("search");
        const search = searchInput.value.trim();
        if (!search) return;

        change_mode("online");
        parent.innerHTML = "";
        songloader.hidden = false;
        noresult.hidden = true;

        fetch('/search?search=' + encodeURIComponent(search))
            .then(res => res.json())
            .then(data => {
                songloader.hidden = true;
                searchResults = data.song_list || [];
                if (searchResults.length === 0) noresult.hidden = false;
                create_song_card();
                searchInput.value = "";
            })
            .catch(() => {
                songloader.hidden = true;
                noresult.hidden = false;
            });
    }

    function create_song_card() {
        const mode = currentMode;
        const list = mode === "offline" ? savedSongs : searchResults;
        const targetParent = mode === "offline" ? offline_parent : parent;
        const offlineSearch = document.getElementById("offline-search").value.toLowerCase();

        targetParent.innerHTML = "";
        let count = 0;

        list.forEach(song => {
            if (mode === "online" && song.resultType !== currentType) return;
            if (mode === "offline" && !song.song_name.toLowerCase().includes(offlineSearch)) return;

            const temp = song_temp.cloneNode(true);
            temp.hidden = false;
            temp.id = "";
            temp.setAttribute("data-song-id", song.id);
            if (currentSongId === song.id) temp.classList.add("selected");

            let displayImage = song.image || "/static/img/bg.png";
            if (mode === "offline" && song.image_blob instanceof Blob) {
                displayImage = URL.createObjectURL(song.image_blob);
            }

            temp.querySelector("img").src = displayImage;
            temp.querySelector(".song-name").innerHTML = song.song_name;
            temp.querySelector(".atrist-name").innerHTML = song.artist_name;
            temp.querySelector(".delbtn").setAttribute("data-id", song.id);
            if (mode === "online") temp.querySelector(".delbtn").hidden = true;

            temp.onclick = () => load_song(song);
            targetParent.appendChild(temp);
            count++;
        });

        if (mode === "offline") noresult_offline.hidden = count > 0;
        else noresult.hidden = count > 0;
    }

    async function create_saved_song_list() {
        if (!db) return;
        const tx = db.transaction('songs', 'readonly');
        const store = tx.objectStore('songs');
        const request = store.getAll();
        request.onsuccess = () => {
            savedSongs = request.result;
            savedSongs.sort((a, b) => (b.index || 0) - (a.index || 0));
            if (currentMode === "offline") create_song_card();
        };
    }

    function change_mode(mode) {
        currentMode = mode;
        document.getElementById("online-block").hidden = mode === "offline";
        document.getElementById("offline-block").hidden = mode === "online";
        document.getElementById("play-offline").classList.toggle("active", mode === "offline");
        document.getElementById("play-online").classList.toggle("active", mode === "online");
        create_song_card();
    }

    function toggle_type(type) {
        currentType = type;
        document.getElementById("type-song").classList.toggle("active", type === "song");
        document.getElementById("type-video").classList.toggle("active", type === "video");
        create_song_card();
    }

    function scrollToTop() {
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function toggleSideMenu() {
        document.getElementById("side-menu").classList.toggle("active");
        document.getElementById("side-menu-overlay").classList.toggle("active");
    }

    window.addEventListener('scroll', () => {
        if (window.scrollY > 300 && player.src !== "") miniPlayer.classList.add('active');
        else miniPlayer.classList.remove('active');
    });

    player.onplay = () => {
        set_play_state("pause");
    };
    player.onpause = () => {
        set_play_state("play");
    };
    player.onloadedmetadata = () => total_time.textContent = formatTime(player.duration);

    let isDragging = false;
    player.ontimeupdate = () => {
        if (!isDragging) {
            const pos = (player.currentTime / player.duration * 100).toFixed(2) + "%";
            time_slider.style.left = pos;
            time_fill.style.width = pos;
            miniProgressBar.style.width = pos;
            elapsed_time.textContent = formatTime(player.currentTime);
        }
    };

    function handleSeek(e) {
        const rect = track.getBoundingClientRect();
        const clientX = e.type.startsWith('touch') ? e.touches[0].clientX : e.clientX;
        const percent = Math.max(0, Math.min((clientX - rect.left) / rect.width, 1));
        const pos = (percent * 100).toFixed(2) + "%";
        time_slider.style.left = pos;
        time_fill.style.width = pos;
        return percent;
    }

    track.onmousedown = () => isDragging = true;
    window.onmousemove = (e) => isDragging && handleSeek(e);
    window.onmouseup = (e) => {
        if (isDragging) {
            player.currentTime = player.duration * handleSeek(e);
            isDragging = false;
            player.play();
        }
    };

    document.addEventListener("DOMContentLoaded", async () => {
        await initDB();
        create_saved_song_list();
        const last = localStorage.getItem("lastPlayedSong");
        if (last) load_song(JSON.parse(last), false);
    });
</script>

</html>
