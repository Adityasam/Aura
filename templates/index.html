<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Player</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Raleway:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <link href="/static/css/myToastr.css" rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

    <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
    <meta name="theme-color" content="#ff6f62">
    <link rel="icon" href="{{ url_for('static', filename='icons/icon-192.png') }}">
    <script src="/static/js/myToastr.js"></script>

    <style>
        :root {
            --orange: #ff6f62;
            --dark-bg: #18181f;
            --surface: #1e1e26;
            --text-primary: #e0e0e6;
            --text-secondary: #a0a0b0;
            --accent-gradient: linear-gradient(135deg, var(--orange) 0%, #ff8566 100%);
            --neo-shadow-light: rgba(255, 255, 255, 0.05);
            --neo-shadow-dark: rgba(0, 0, 0, 0.5);
            --neo-inset: inset 3px 3px 7px var(--neo-shadow-dark), inset -3px -3px 7px var(--neo-shadow-light);
            --neo-flat: 8px 8px 16px var(--neo-shadow-dark), -8px -8px 16px var(--neo-shadow-light);
            --neo-pressed: inset 6px 6px 12px var(--neo-shadow-dark), inset -6px -6px 12px var(--neo-shadow-light);
            --neo-float: 12px 12px 24px rgba(0, 0, 0, 0.6), -8px -8px 24px rgba(255, 255, 255, 0.03);
            --transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            transition: var(--transition);
        }

        html,
        body {
            overscroll-behavior-y: contain;
            background-color: var(--dark-bg);
            color: var(--text-primary);
        }

        body {
            font-family: 'Raleway', sans-serif;
            font-size: 14px;
            margin: 0;
            overflow-x: hidden;
            background: radial-gradient(circle at top right, rgba(255, 111, 98, 0.05), transparent 400px),
                        radial-gradient(circle at bottom left, rgba(255, 111, 98, 0.03), transparent 300px);
            min-height: 100vh;
        }

        .app-header {
            display: flex;
            align-items: center;
            gap: 1.5rem;
            padding: 1.5rem 2rem;
            max-width: 800px;
            margin: 0 auto;
            animation: slideInDown 0.8s cubic-bezier(0.16, 1, 0.3, 1);
            position: sticky;
            top: 0;
            z-index: 1000;
            background: rgba(24, 24, 31, 0.8);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .header-burger {
            width: 55px;
            height: 55px;
            background: var(--surface);
            border-radius: 1.2rem;
            box-shadow: var(--neo-flat);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--orange);
            cursor: pointer;
            border: 1px solid rgba(255, 255, 255, 0.02);
            flex-shrink: 0;
        }

        .header-burger:hover {
            box-shadow: var(--neo-pressed);
            transform: scale(0.95);
        }

        .header-search {
            flex-grow: 1;
        }

        .nav-bar {
            display: flex;
            justify-content: center;
            gap: 1rem;
            padding: 0 2rem 2rem;
            max-width: 800px;
            margin: 0 auto;
            animation: slideInDown 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .play-mode {
            background: var(--surface) !important;
            box-shadow: var(--neo-flat);
            padding: 0.8rem 1.5rem;
            border-radius: 1.2rem;
            font-weight: 700;
            color: var(--text-secondary);
            cursor: pointer;
            border: 1px solid rgba(255, 255, 255, 0.02) !important;
            flex: 1;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .play-mode.active {
            box-shadow: var(--neo-pressed) !important;
            color: var(--orange) !important;
        }

        .playback-options {
            display: flex;
            justify-content: center;
            gap: 1.5rem;
            margin-top: 1.5rem;
        }

        .loop-type {
            background: var(--surface);
            box-shadow: var(--neo-flat);
            width: 45px;
            height: 45px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-secondary);
            cursor: pointer;
            border: 1px solid rgba(255, 255, 255, 0.02);
        }

        .loop-type.active {
            box-shadow: var(--neo-pressed);
            color: var(--orange);
        }

        .main-song-container {
            margin: 0 auto 2rem;
            max-width: 500px;
            padding: 2.5rem;
            background: var(--surface);
            border-radius: 3rem;
            box-shadow: var(--neo-flat);
            border: 1px solid rgba(255, 255, 255, 0.03);
            animation: slideInDown 0.8s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
        }

        input {
            border-radius: 1.5rem !important;
            padding: 0.8rem 1.5rem !important;
            background-color: var(--surface) !important;
            border: 1px solid rgba(255, 255, 255, 0.02) !important;
            box-shadow: var(--neo-inset) !important;
            color: var(--text-primary) !important;
            height: 3.5rem !important;
            font-size: 1rem !important;
        }

        input::placeholder {
            color: var(--text-secondary) !important;
            opacity: 0.7;
        }

        input:focus {
            box-shadow: var(--neo-pressed) !important;
            border-color: rgba(255, 111, 98, 0.2) !important;
        }

        .offline-search-container {
            background: var(--surface);
            box-shadow: var(--neo-inset);
            border-radius: 1.5rem;
            padding: 0.5rem 1.5rem;
            margin: 0 2rem 2rem;
            display: flex;
            align-items: center;
            gap: 1rem;
            border: 1px solid rgba(255, 255, 255, 0.02);
        }

        .offline-search-container i {
            color: var(--orange);
        }

        .main-image-box {
            width: 280px;
            height: 280px;
            margin: 0 auto;
            border-radius: 50%;
            padding: 10px;
            background: var(--surface);
            box-shadow: var(--neo-flat);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .main-image {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            box-shadow: var(--neo-pressed);
            border: 5px solid var(--surface);
        }

        .main-song-info-block {
            padding: 2rem 0 0;
            text-align: center;
        }

        .main-song-name {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--text-primary);
            margin-bottom: 2rem;
            letter-spacing: -0.5px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .control-btn {
            font-size: 1.5rem;
            color: var(--text-secondary);
            cursor: pointer;
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: var(--surface);
            box-shadow: var(--neo-flat);
        }

        .control-btn:hover {
            color: var(--orange);
            box-shadow: var(--neo-pressed);
            transform: scale(0.95);
        }

        .play-btn-main {
            width: 85px;
            height: 85px;
            background: var(--surface);
            box-shadow: var(--neo-flat);
            border-radius: 50%;
            padding: 25px;
            cursor: pointer;
            border: 2px solid rgba(255, 111, 98, 0.1);
        }

        .play-btn-main:hover {
            box-shadow: var(--neo-pressed);
            transform: scale(0.95);
        }

        .slider-track {
            height: 10px;
            background: var(--surface);
            border-radius: 10px;
            box-shadow: var(--neo-inset);
            position: relative;
            cursor: pointer;
            margin: 2rem 0 0.5rem;
        }

        .slider-fill {
            background: var(--accent-gradient);
            box-shadow: 0 0 15px rgba(255, 111, 98, 0.3);
            border-radius: 10px;
            height: 100%;
            width: 0%;
            position: relative;
        }

        .slider {
            width: 22px;
            height: 22px;
            background: #fff;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            border-radius: 50%;
            position: absolute;
            top: 50%;
            transform: translate(-50%, -50%);
            left: 0;
            pointer-events: none;
            border: 4px solid var(--orange);
        }

        .list-item-box {
            background: var(--surface);
            border-radius: 2rem;
            padding: 1.2rem;
            margin-bottom: 1.5rem;
            box-shadow: var(--neo-flat);
            border: 1px solid rgba(255, 255, 255, 0.02);
            display: flex;
            align-items: center;
            gap: 1.2rem;
            cursor: pointer;
        }

        .list-item-box:hover {
            transform: translateY(-3px);
            box-shadow: 10px 10px 20px var(--neo-shadow-dark), -8px -8px 20px var(--neo-shadow-light);
        }

        .list-item-box.selected {
            box-shadow: var(--neo-pressed);
            background: rgba(255, 111, 98, 0.03);
            border-color: rgba(255, 111, 98, 0.15);
        }

        .search-btn {
            background: var(--surface) !important;
            width: 3.5rem !important;
            height: 3.5rem !important;
            border-radius: 1.2rem !important;
            box-shadow: var(--neo-flat) !important;
            color: var(--orange) !important;
            border: none !important;
        }

        .side-menu {
            background: rgba(30, 30, 38, 0.85);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border-right: 1px solid rgba(255, 255, 255, 0.05);
            padding: 2.5rem;
            width: 320px;
        }

        .menu-item {
            background: var(--surface);
            box-shadow: var(--neo-flat);
            margin: 0 0 1.5rem 0;
            padding: 1.2rem;
            border-radius: 1.2rem;
            display: flex;
            align-items: center;
            gap: 1rem;
            font-weight: 600;
            color: var(--text-primary);
            cursor: pointer;
        }

        .menu-item i {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--surface);
            box-shadow: var(--neo-inset);
            border-radius: 0.8rem;
            color: var(--orange);
        }

        .mini-player {
            background: rgba(24, 24, 31, 0.8);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            box-shadow: 0 -15px 40px rgba(0, 0, 0, 0.6);
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            padding: 1rem 2rem;
            border-radius: 3rem 3rem 0 0;
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            z-index: 1100;
            transform: translateY(100%);
            transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .mini-progress-container {
            height: 5px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            margin-bottom: 5px;
        }

        .result-type-container {
            display: flex;
            gap: 1.5rem;
            padding: 0 2rem 2rem;
            max-width: 600px;
            margin: 0 auto;
        }

        .result-type {
            background: var(--surface);
            box-shadow: var(--neo-flat);
            border-radius: 1.5rem;
            padding: 1.2rem;
            flex: 1;
            text-align: center;
            cursor: pointer;
            color: var(--text-secondary);
        }

        .result-type.active {
            box-shadow: var(--neo-pressed);
            color: var(--orange);
            background: rgba(255, 111, 98, 0.03);
        }

        .delbtn {
            width: 45px;
            height: 45px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 1rem;
            background: var(--surface);
            box-shadow: var(--neo-flat);
            color: var(--text-secondary);
            transition: var(--transition);
        }

        .delbtn:hover {
            box-shadow: var(--neo-pressed);
            color: #ff4d4d;
        }

        .close-menu {
            width: 45px;
            height: 45px;
            border-radius: 1rem;
            background: var(--surface);
            box-shadow: var(--neo-flat);
            border: none;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .close-menu:hover {
            box-shadow: var(--neo-pressed);
            color: var(--orange);
        }

        @keyframes slideInDown {
            from { opacity: 0; transform: translateY(-30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes slideInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Responsive adjustments */
        @media (max-width: 768px) {
            .app-header { padding: 1rem; gap: 1rem; }
            .header-burger { width: 50px; height: 50px; }
            .nav-bar { padding: 0 1rem 1.5rem; }
            .main-song-container { margin: 1rem; padding: 1.5rem; }
            .main-image-box { width: 220px; height: 220px; }
            .playback-options { gap: 1rem; }
            .online-list-container, .offline-list-container { width: 95vw; padding: 1rem 1rem 8rem; }
        }

        .mini-player.active {
            transform: translateY(0);
        }

        .mini-progress-container {
            height: 4px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            margin-bottom: 8px;
            overflow: hidden;
        }

        .mini-progress-bar {
            height: 100%;
            background: var(--accent-gradient);
            width: 0%;
            transition: width 0.1s linear;
        }

        .mini-player-img {
            width: 55px;
            height: 55px;
            border-radius: 1.2rem;
            object-fit: cover;
            box-shadow: 0 5px 15px rgba(0,0,0,0.4);
            border: 1px solid rgba(255,255,255,0.1);
        }

        .mini-player-name {
            font-weight: 800;
            font-size: 1rem;
            color: var(--text-primary);
            letter-spacing: -0.3px;
        }

        .menu-header span {
            display: flex;
            align-items: center;
            gap: 1rem;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 2.2rem;
        }

        .menu-header i {
            -webkit-text-fill-color: var(--orange);
            font-size: 1.8rem;
        }

        .slider {
            width: 20px;
            height: 20px;
            background: #fff;
            box-shadow: 0 0 15px rgba(255, 111, 98, 0.5);
            border-radius: 50%;
            position: absolute;
            top: 50%;
            transform: translate(-50%, -50%);
            left: 0;
            pointer-events: none;
            border: 5px solid var(--orange);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .slider-track:hover .slider {
            transform: translate(-50%, -50%) scale(1.2);
            box-shadow: 0 0 25px rgba(255, 111, 98, 0.8);
        }

        .online-list-container, .offline-list-container {
            width: 100%;
            max-width: 800px;
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
            padding: 1rem 2rem 8rem;
            animation: slideInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .list-item-box img {
            width: 65px;
            height: 65px;
            object-fit: cover;
            border-radius: 1.2rem;
            box-shadow: var(--neo-flat);
        }

        .song-info {
            display: flex;
            flex-direction: column;
            justify-content: center;
            flex-grow: 1;
            min-width: 0;
        }

        .song-name {
            font-weight: 700;
            color: var(--text-primary);
            font-size: 1.1rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .atrist-name {
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-top: 2px;
        }

        .time-stamp-container {
            display: flex;
            justify-content: space-between;
            padding: 0 0.5rem;
            font-weight: 700;
            color: var(--text-secondary);
            font-size: 0.8rem;
            margin-top: 0.5rem;
        }

        .side-menu-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            z-index: 999;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
        }

        .side-menu-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .side-menu {
            position: fixed;
            top: 0;
            left: 0;
            height: 100vh;
            width: 320px;
            z-index: 9999;
            transform: translateX(-100%);
            transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .side-menu.active {
            transform: translateX(0);
        }

        .menu-header {
            font-size: 2rem;
            font-weight: 900;
            color: var(--orange);
            margin-bottom: 3.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        #no-result, #no-result-offline {
            text-align: center;
            padding: 4rem;
            color: var(--text-secondary);
            font-weight: 600;
            font-style: italic;
        }

        #song-loading {
            display: flex;
            justify-content: center;
            padding: 2rem;
        }
    </style>
</head>

<body>
    <!-- Side Menu -->
    <div class="side-menu-overlay" id="side-menu-overlay" onclick="toggleSideMenu()"></div>
    <div class="side-menu" id="side-menu">
        <div class="menu-header">
            <span><i class="fas fa-music"></i> Aura</span>
            <button class="close-menu" onclick="toggleSideMenu()">
                <i class="fas fa-times"></i>
            </button>
        </div>
        <div class="menu-item" onclick="export_songs()">
            <i class="fas fa-file-export"></i>
            <span>Export Library</span>
        </div>
        <div class="menu-item" onclick="import_songs()">
            <i class="fas fa-file-import"></i>
            <span>Import Backup</span>
        </div>
        <div class="mt-auto p-2" style="font-size: 0.8rem; color: var(--text-secondary); text-align: center; opacity: 0.5;">
            Aura Premium Music Player v2.0
        </div>
        <input type="file" id="import-file" hidden accept=".json" onchange="process_import(event)">
    </div>

    <!-- App Header -->
    <header class="app-header">
        <div class="header-burger" onclick="toggleSideMenu()">
            <i class="fas fa-bars"></i>
        </div>
        <div class="header-search">
            <div class="d-flex gap-3">
                <input type="text" class="form-control" id="search"
                    placeholder="Search for music..." autocomplete="off"
                    onkeypress="if(event.key==='Enter') search_song()">
                <button class="search-btn" onclick="search_song()">
                    <i class="fas fa-search fa-lg"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- Navigation Bar -->
    <nav class="nav-bar">
        <div id="play-offline" class="play-mode active" onclick="change_mode('offline')">
            <i class="fas fa-layer-group me-2"></i> My Library
        </div>
        <div id="play-online" class="play-mode" onclick="change_mode('online')">
            <i class="fas fa-compass me-2"></i> Discovery
        </div>
    </nav>

    <div class="container-fluid p-0">
        <div class="main-song-container">
            <div class="main-image-container">
                <audio src="" hidden id="audio_player"></audio>
                <div class="main-image-box">
                    <img id="song-image" src="/static/img/bg.png" class="main-image" alt="">
                </div>
                <div class="main-song-info-block">
                    <div class="main-song-name" id="song-name">Select a Song</div>
                    <div class="d-flex align-items-center justify-content-center gap-5">
                        <i class="fas fa-backward control-btn" onclick="prev_song()"></i>
                        <div class="position-relative">
                            <img src="/static/icons/play.webp" alt="" onclick="player.play()" id="play-btn" class="play-btn-main">
                            <img src="/static/icons/pause.png" onclick="player.pause()" alt="" hidden id="pause-btn" class="play-btn-main">
                            <div id="song-loader" hidden class="position-absolute top-50 start-50 translate-middle">
                                <img src="/static/img/loader.gif" width="40" alt="">
                            </div>
                        </div>
                        <i class="fas fa-forward control-btn" onclick="next_song()"></i>
                    </div>
                    
                    <div class="song-slider-container">
                        <div class="slider-track" id="time-track">
                            <div class="slider-fill" id="time-fill"></div>
                            <div class="slider" id="time-slider"></div>
                        </div>
                    </div>
                    <div class="time-stamp-container">
                        <div id="elapsed-time">00:00</div>
                        <div id="total-time">00:00</div>
                    </div>

                    <!-- Playback Options (Shuffle/Loop) -->
                    <div class="playback-options">
                        <div id="song-loop" class="loop-type active" onclick="change_play_type('loop')" title="Loop All">
                            <i class="fas fa-redo"></i>
                        </div>
                        <div hidden id="song-single-loop" class="loop-type" onclick="change_play_type('single-loop')" title="Loop One">
                            <i class="fas fa-redo-alt"></i>
                        </div>
                        <div hidden id="song-shuffle" class="loop-type" onclick="change_play_type('shuffle')" title="Shuffle">
                            <i class="fas fa-random"></i>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="mode-block" hidden id="online-block">
            <div class="result-type-container">
                <div class="result-type active" id="type-song" onclick="toggle_type('song')">
                    <i class="fas fa-music fa-2x mb-2 d-block"></i>
                    <span>Audio</span>
                </div>
                <div class="result-type" id="type-video" onclick="toggle_type('video')">
                    <i class="fas fa-video fa-2x mb-2 d-block"></i>
                    <span>Video</span>
                </div>
            </div>

            <div id="song-loading" hidden>
                <img src="/static/img/page_loader.gif" alt="" style="width: 50px;">
            </div>
            <div class="online-list-container mx-auto" id="song-list"></div>
            <div id="no-result">No matching results found</div>
        </div>

        <div class="mode-block" id="offline-block">
            <div class="offline-search-container">
                <i class="fas fa-search"></i>
                <input type="text" placeholder="Search your library..." onkeyup="create_song_card()"
                    class="form-control" id="offline-search">
            </div>
            <div class="offline-list-container mx-auto" id="offline-song-list"></div>
            <div id="no-result-offline">Your library is empty</div>
        </div>
    </div>

    <div class="my-toast-container" id="my-toastr"></div>

    <!-- Mini Player -->
    <div class="mini-player" id="mini-player">
        <div class="mini-progress-container">
            <div class="mini-progress-bar" id="mini-progress-bar"></div>
        </div>
        <div class="d-flex align-items-center justify-content-between p-3">
            <div class="mini-player-info d-flex align-items-center gap-3" onclick="scrollToTop()" style="cursor: pointer; flex: 1; min-width: 0;">
                <img src="/static/img/bg.png" class="mini-player-img" id="mini-player-img" style="width: 50px; height: 50px; border-radius: 12px; object-fit: cover;">
                <div style="min-width: 0;">
                    <div class="mini-player-name" id="mini-player-name" style="font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">Unknown Song</div>
                </div>
            </div>
            <div class="d-flex gap-3">
                <i class="fas fa-play fa-lg" id="mini-play-btn" onclick="player.play()" style="cursor: pointer; color: var(--orange);"></i>
                <i class="fas fa-pause fa-lg" id="mini-pause-btn" hidden onclick="player.pause()" style="cursor: pointer; color: var(--orange);"></i>
            </div>
        </div>
    </div>

    <!-- Templates -->
    <div hidden id="song-template" class="list-item-box">
        <img src="/static/img/bg.png" class="click-btn" alt="">
        <div class="song-info click-btn">
            <div class="song-name">Song Name</div>
            <div class="atrist-name">Artist Name</div>
        </div>
        <i class="fas fa-trash-alt delbtn" onclick="delete_song(event)"></i>
    </div>
</body>
<script>
    const parent = document.getElementById("song-list");
    const offline_parent = document.getElementById("offline-song-list");
    const song_temp = document.getElementById("song-template");
    const player = document.getElementById("audio_player");
    const song_image = document.getElementById("song-image");
    const song_name = document.getElementById("song-name");
    const play_btn = document.getElementById("play-btn");
    const pause_btn = document.getElementById("pause-btn");
    const song_loader = document.getElementById("song-loader");
    const time_slider = document.getElementById("time-slider");
    const time_fill = document.getElementById("time-fill");
    const track = document.getElementById("time-track");
    const elapsed_time = document.getElementById("elapsed-time");
    const total_time = document.getElementById("total-time");
    const noresult = document.getElementById("no-result");
    const noresult_offline = document.getElementById("no-result-offline");
    const songloader = document.getElementById("song-loading");

    const miniPlayer = document.getElementById("mini-player");
    const miniProgressBar = document.getElementById("mini-progress-bar");
    const miniPlayerImg = document.getElementById("mini-player-img");
    const miniPlayerName = document.getElementById("mini-player-name");
    const miniPlayBtn = document.getElementById("mini-play-btn");
    const miniPauseBtn = document.getElementById("mini-pause-btn");

    function toggleSideMenu() {
        document.getElementById("side-menu").classList.toggle("active");
        document.getElementById("side-menu-overlay").classList.toggle("active");
    }

    let current_state = "";
    let currentSongId = 0;
    let searchResults = [];
    let savedSongs = [];
    let currentMode = "offline";
    let currentType = "song";
    let currentPlayType = "loop";
    let db;

    async function initDB() {
        return new Promise((resolve, reject) => {
            const request = indexedDB.open("myMediaDB", 1);
            request.onupgradeneeded = (e) => {
                db = e.target.result;
                if (!db.objectStoreNames.contains('songs')) {
                    db.createObjectStore('songs');
                }
            };
            request.onsuccess = (e) => {
                db = e.target.result;
                resolve();
            };
            request.onerror = (e) => reject(e);
        });
    }

    async function saveBlob(song) {
        if (!db) return;
        
        // Add index for sorting if not present
        if (!song.index) song.index = Date.now();
        
        // Upscale image URL if low-res and force re-fetch of image_blob
        if (song.image && song.image.includes("w60-h60")) {
            song.image = song.image.replace("w60-h60", "w400-h400");
            delete song.image_blob;
        }
        
        // Fetch and save image as blob if not already saved
        if (!song.image_blob && song.image) {
            try {
                const response = await fetch(song.image);
                const blob = await response.blob();
                song.image_blob = blob;
            } catch (e) {
                console.error("Failed to save image blob:", e);
            }
        }

        const tx = db.transaction('songs', 'readwrite');
        const store = tx.objectStore('songs');
        store.put(song, song.id);
        tx.oncomplete = () => create_saved_song_list();
    }

    async function loadBlob(id) {
        if (!db) return null;
        return new Promise((resolve) => {
            const tx = db.transaction('songs', 'readonly');
            const store = tx.objectStore('songs');
            const request = store.get(id);
            request.onsuccess = () => resolve(request.result);
            request.onerror = () => resolve(null);
        });
    }

    function delete_song(e) {
        e.stopPropagation();
        const id = e.target.closest('.delbtn').getAttribute("data-id");
        if (!confirm("Remove this song from library?")) return;
        
        const tx = db.transaction('songs', 'readwrite');
        const store = tx.objectStore('songs');
        store.delete(id);
        tx.oncomplete = () => {
            show_toast("Song removed");
            create_saved_song_list();
        };
    }

    function export_songs() {
        if (!db) return;
        const tx = db.transaction('songs', 'readonly');
        const store = tx.objectStore('songs');
        const request = store.getAll();
        request.onsuccess = () => {
            const songs = request.result;
            if (!songs || songs.length === 0) {
                show_toast("No songs to export");
                return;
            }
            const exportData = songs.map(s => {
                const { blob, image_blob, ...rest } = s;
                return rest;
            });
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(exportData));
            const downloadAnchorNode = document.createElement('a');
            downloadAnchorNode.setAttribute("href", dataStr);
            downloadAnchorNode.setAttribute("download", "aura_export.json");
            document.body.appendChild(downloadAnchorNode); 
            downloadAnchorNode.click();
            downloadAnchorNode.remove();
            show_toast(`Exported ${exportData.length} songs`);
        };
    }

    function import_songs() {
        document.getElementById('import-file').click();
    }

    function process_import(event) {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const songs = JSON.parse(e.target.result);
                if (!Array.isArray(songs)) {
                    show_toast("Invalid file format");
                    return;
                }

                const tx = db.transaction('songs', 'readwrite');
                const store = tx.objectStore('songs');
                let addedCount = 0;
                let processedCount = 0;

                songs.forEach(song => {
                    if (song.id) {
                        const request = store.get(song.id);
                        request.onsuccess = (ev) => {
                            if (!ev.target.result) {
                                store.put(song, song.id);
                                addedCount++;
                            }
                            processedCount++;
                            checkCompletion();
                        };
                        request.onerror = () => {
                             processedCount++;
                             checkCompletion();
                        };
                    } else {
                        processedCount++;
                        checkCompletion();
                    }
                });

                function checkCompletion() {
                    if (processedCount === songs.length) {
                        if (addedCount > 0) {
                            show_toast(`Imported ${addedCount} new songs`);
                            create_saved_song_list();
                        } else {
                            show_toast("No new songs to import");
                        }
                        event.target.value = '';
                    }
                }
            } catch (err) {
                show_toast("Error parsing file");
            }
        };
        reader.readAsText(file);
    }

    function formatTime(seconds) {
        const min = Math.floor(seconds / 60);
        const sec = Math.floor(seconds % 60);
        return (min < 10 ? '0' : '') + min + ":" + (sec < 10 ? '0' : '') + sec;
    }

    function set_play_state(state) {
        current_state = state;
        if (state == "play") {
            pause_btn.hidden = true;
            song_loader.hidden = true;
            play_btn.hidden = false;
            miniPlayBtn.hidden = false;
            miniPauseBtn.hidden = true;
        } else if (state == "pause") {
            pause_btn.hidden = false;
            song_loader.hidden = true;
            play_btn.hidden = true;
            miniPlayBtn.hidden = true;
            miniPauseBtn.hidden = false;
        } else if (state == "loading") {
            pause_btn.hidden = true;
            song_loader.hidden = false;
            play_btn.hidden = true;
            miniPlayBtn.hidden = true;
            miniPauseBtn.hidden = true;
        }
    }

    function next_song() {
        const list = currentMode === "offline" ? savedSongs : searchResults.filter(s => s.resultType === currentType);
        if (list.length === 0) return;
        
        let index = list.findIndex(s => s.id === currentSongId);
        if (currentPlayType === "shuffle") {
            index = Math.floor(Math.random() * list.length);
        } else {
            index = (index + 1) % list.length;
        }
        load_song(list[index]);
    }

    function prev_song() {
        const list = currentMode === "offline" ? savedSongs : searchResults.filter(s => s.resultType === currentType);
        if (list.length === 0) return;
        
        let index = list.findIndex(s => s.id === currentSongId);
        index = (index - 1 + list.length) % list.length;
        load_song(list[index]);
    }

    function change_play_type(type) {
        document.getElementById("song-loop").hidden = true;
        document.getElementById("song-single-loop").hidden = true;
        document.getElementById("song-shuffle").hidden = true;
        
        if (type === "loop") {
            currentPlayType = "single-loop";
            document.getElementById("song-single-loop").hidden = false;
        } else if (type === "single-loop") {
            currentPlayType = "shuffle";
            document.getElementById("song-shuffle").hidden = false;
        } else {
            currentPlayType = "loop";
            document.getElementById("song-loop").hidden = false;
        }
        show_toast(`Play mode: ${currentPlayType}`);
    }

    player.onended = () => {
        if (currentPlayType === "single-loop") {
            player.currentTime = 0;
            player.play();
        } else {
            next_song();
        }
    };

    async function load_song(song, autoPlay = true) {
        try {
            const id = song.id;
            currentSongId = song.id;
            localStorage.setItem("lastPlayedSong", JSON.stringify(song));

            document.querySelectorAll(".list-item-box").forEach(box => {
                if (box.getAttribute("data-song-id") === id) box.classList.add("selected");
                else box.classList.remove("selected");
            });

            player.currentTime = 0;
            
            // Check for saved data in IndexedDB
            const savedData = await loadBlob(id);
            
            let imageUrl = song.image;
            let needsImageUpdate = false;

            if (imageUrl && imageUrl.includes("w60-h60")) {
                imageUrl = imageUrl.replace("w60-h60", "w400-h400");
                song.image = imageUrl;
                needsImageUpdate = true;
            }

            if (savedData && savedData.image_blob instanceof Blob && !needsImageUpdate) {
                imageUrl = URL.createObjectURL(savedData.image_blob);
            } else if (imageUrl && imageUrl.includes("w60-h60")) {
                // This branch is now redundant due to the check above but kept for safety
                imageUrl = imageUrl.replace("w60-h60", "w400-h400");
            }

            song_image.crossOrigin = "anonymous";
            miniPlayerImg.crossOrigin = "anonymous";
            song_image.src = imageUrl || "/static/img/bg.png";
            miniPlayerImg.src = imageUrl || "/static/img/bg.png";

            song_name.innerHTML = song.song_name || "Unknown Song";
            miniPlayerName.innerHTML = song.song_name || "Unknown Song";
            
            set_play_state(autoPlay ? "loading" : "play");

            if (savedData && savedData.blob instanceof Blob) {
                player.src = URL.createObjectURL(savedData.blob);
                if (autoPlay) player.play().catch(() => set_play_state("play"));
                if (needsImageUpdate) saveBlob(song); // Fix low-res image for saved song
            } else {
                const fetchType = song.resultType || "song";
                fetch(`/load_song?id=${id}&type=${fetchType}`)
                    .then(res => res.blob())
                    .then(blob => {
                        if (blob instanceof Blob) {
                            player.src = URL.createObjectURL(blob);
                            if (autoPlay) player.play().catch(() => set_play_state("play"));
                            song["blob"] = blob;
                            saveBlob(song);
                        }
                    })
                    .catch(() => set_play_state("play"));
            }
        } catch (err) {
            console.error(err);
        }
    }

    function search_song() {
        const searchInput = document.getElementById("search");
        const search = searchInput.value.trim();
        if (!search) return;

        change_mode("online");
        parent.innerHTML = "";
        songloader.hidden = false;
        noresult.hidden = true;

        fetch('/search?search=' + encodeURIComponent(search))
            .then(res => res.json())
            .then(data => {
                songloader.hidden = true;
                searchResults = data.song_list || [];
                if (searchResults.length === 0) noresult.hidden = false;
                create_song_card();
                searchInput.value = "";
            })
            .catch(() => {
                songloader.hidden = true;
                noresult.hidden = false;
            });
    }

    function create_song_card() {
        const mode = currentMode;
        const list = mode === "offline" ? savedSongs : searchResults;
        const targetParent = mode === "offline" ? offline_parent : parent;
        const offlineSearch = document.getElementById("offline-search").value.toLowerCase();

        targetParent.innerHTML = "";
        let count = 0;

        list.forEach(song => {
            if (mode === "online" && song.resultType !== currentType) return;
            if (mode === "offline" && !song.song_name.toLowerCase().includes(offlineSearch)) return;

            const temp = song_temp.cloneNode(true);
            temp.hidden = false;
            temp.id = "";
            temp.setAttribute("data-song-id", song.id);
            if (currentSongId === song.id) temp.classList.add("selected");

            let displayImage = song.image || "/static/img/bg.png";
            if (mode === "offline" && song.image_blob instanceof Blob) {
                displayImage = URL.createObjectURL(song.image_blob);
            }

            temp.querySelector("img").src = displayImage;
            temp.querySelector(".song-name").innerHTML = song.song_name;
            temp.querySelector(".atrist-name").innerHTML = song.artist_name;
            temp.querySelector(".delbtn").setAttribute("data-id", song.id);
            if (mode === "online") temp.querySelector(".delbtn").hidden = true;

            temp.onclick = () => load_song(song);
            targetParent.appendChild(temp);
            count++;
        });

        if (mode === "offline") noresult_offline.hidden = count > 0;
        else noresult.hidden = count > 0;
    }

    async function create_saved_song_list() {
        if (!db) return;
        const tx = db.transaction('songs', 'readonly');
        const store = tx.objectStore('songs');
        const request = store.getAll();
        request.onsuccess = () => {
            savedSongs = request.result;
            
            // Sort by index (new to old)
            savedSongs.sort((a, b) => (b.index || 0) - (a.index || 0));
            
            if (currentMode === "offline") create_song_card();
        };
    }

    function change_mode(mode) {
        currentMode = mode;
        document.getElementById("online-block").hidden = mode === "offline";
        document.getElementById("offline-block").hidden = mode === "online";
        document.getElementById("play-offline").classList.toggle("active", mode === "offline");
        document.getElementById("play-online").classList.toggle("active", mode === "online");
        create_song_card();
    }

    function toggle_type(type) {
        currentType = type;
        document.getElementById("type-song").classList.toggle("active", type === "song");
        document.getElementById("type-video").classList.toggle("active", type === "video");
        create_song_card();
    }

    function scrollToTop() {
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    window.addEventListener('scroll', () => {
        if (window.scrollY > 300 && player.src !== "") miniPlayer.classList.add('active');
        else miniPlayer.classList.remove('active');
    });

    player.onplay = () => set_play_state("pause");
    player.onpause = () => set_play_state("play");
    player.onloadedmetadata = () => total_time.textContent = formatTime(player.duration);

    let isDragging = false;
    player.ontimeupdate = () => {
        if (!isDragging) {
            const pos = (player.currentTime / player.duration * 100).toFixed(2) + "%";
            time_slider.style.left = pos;
            time_fill.style.width = pos;
            miniProgressBar.style.width = pos;
            elapsed_time.textContent = formatTime(player.currentTime);
        }
    };

    function handleSeek(e) {
        const rect = track.getBoundingClientRect();
        const clientX = e.type.startsWith('touch') ? e.touches[0].clientX : e.clientX;
        const percent = Math.max(0, Math.min((clientX - rect.left) / rect.width, 1));
        const pos = (percent * 100).toFixed(2) + "%";
        time_slider.style.left = pos;
        time_fill.style.width = pos;
        return percent;
    }

    track.onmousedown = () => isDragging = true;
    window.onmousemove = (e) => isDragging && handleSeek(e);
    window.onmouseup = (e) => {
        if (isDragging) {
            player.currentTime = player.duration * handleSeek(e);
            isDragging = false;
            player.play();
        }
    };

    document.addEventListener("DOMContentLoaded", async () => {
        await initDB();
        create_saved_song_list();
        const last = localStorage.getItem("lastPlayedSong");
        if (last) load_song(JSON.parse(last), false);
    });
</script>

</html>
